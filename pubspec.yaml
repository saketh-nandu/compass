name: compass
description: "A professional compass and level utility app with advanced features."
publish_to: "none"
version: 1.0.1

environment:
  sdk: ^3.5.0

dependencies:
  shared_preferences: ^2.0.0
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  math_expressions: ^2.6.0
  flutter_secure_storage: ^10.0.0
  sensors_plus: ^7.0.0
  flutter_compass: ^0.8.1
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.2
  go_router: ^14.2.7
  # Supabase integration
  supabase_flutter: ^2.8.0
  # Firebase Cloud Messaging
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Media handling
  video_player: ^2.9.2
  audio_waveforms: ^1.1.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  # Additional utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: logo.png
  remove_alpha_ios: true
